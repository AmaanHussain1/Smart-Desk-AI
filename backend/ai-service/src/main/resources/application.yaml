server:
  port: 8081

spring:
  application:
    name: ai-service
  ai:
    # Explicitly enable the chat model
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # Update to the latest supported model
            model: gemini-2.5-flash