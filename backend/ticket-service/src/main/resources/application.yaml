server:
  port: 8080

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smartdesk
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect